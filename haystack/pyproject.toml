[project]
name = "opendma-demo-alfresco-haystack-metadata-aware-rag"
version = "0.1.0"
description = "Metadata-aware RAG over Alfresco content with Haystack and OpenDMA"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "docling-haystack>=1.0.0",
    "haystack-ai>=2.0.0,<4.0.0",
    "opendma-haystack>=0.2.0",
    "openai>=1.0.0",
    "opendma-api>=0.8.0",
    "opendma-remote>=0.8.0",
    "pypdf>=4",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "trafilatura>=1.8",
]

[project.scripts]
alfresco-metadata-rag = "opendma_demo_alfresco_haystack_metadata_aware_rag.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

