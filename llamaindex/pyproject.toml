[project]
name = "opendma-demo-alfresco-llamaindex-metadata-aware-rag"
version = "0.1.0"
description = "Metadata-aware RAG over Alfresco content with LlamaIndex and OpenDMA"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "llama-index>=0.14.0",
    "llama-index-readers-opendma>=0.2.0,<0.3.0",
    "llama-index-readers-file>=0.5.0",
    "llama-index-readers-docling>=0.5.0",
    "llama-index-llms-openai>=0.6.0",
    "llama-index-embeddings-openai>=0.5.0",
    "opendma-api>=0.8.0",
    "opendma-remote>=0.8.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
alfresco-metadata-rag = "opendma_demo_alfresco_llamaindex_metadata_aware_rag.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
