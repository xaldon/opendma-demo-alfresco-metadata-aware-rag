[project]
name = "opendma-demo-alfresco-langchain-metadata-aware-rag"
version = "0.1.0"
description = "Metadata-aware RAG over Alfresco content with LangChain and OpenDMA"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "langchain>=1.0.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langchain-opendma[unstructured]",
    "langgraph>=1.0.0,<2.0.0",
    "opendma-api>=0.8.0",
    "opendma-remote>=0.8.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
alfresco-metadata-rag = "opendma_demo_alfresco_langchain_metadata_aware_rag.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

